name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint and format (Biome)
        run: npm run lint
      - name: Typecheck (src and tests)
        run: npm run typecheck
      - name: Test with coverage
        run: npm run coverage
      - name: Build
        run: npm run build
      - name: CLI smoke test
        run: node dist/cli.js --version
      - name: Check the published file list
        run: npm pack --dry-run
